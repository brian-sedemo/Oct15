run_name: snowfall-pro-70b-r12
cluster: glacier-prod-01      # 2,048 x H100 (reserved) — budget code FMG-Q3-014

model:
  model_name: snowfall-pro-70b
  vocab_size: 128256
  hidden_size: 8192
  intermediate_size: 28672
  num_layers: 80
  num_heads: 64
  num_kv_heads: 8
  max_position: 131072
  local_window: 1024
  use_moe: false

optim:
  peak_lr: 0.0003
  weight_decay: 0.1
  betas: [0.9, 0.95]

train:
  seq_len: 8192
  micro_batch_size: 4
  global_batch_tokens: 16777216    # 16M tokens/step
  warmup_steps: 2000
  stable_steps: 280000
  total_steps: 360000
  ckpt_every: 2000

data:
  mixture: permafrost_v4           # see training/data/pipeline.py (TRADE SECRET)
  checkpoint_bucket: nimbus-snow-checkpoints
