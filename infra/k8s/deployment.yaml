# CONFIDENTIAL — Nimbus AI Internal Use Only — Project SNOW
# Snowfall serving deployment (glacier-serve-use2)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snowfall-serving
  namespace: snow-serving
  labels:
    app: snowfall
    classification: restricted
    project: snow
spec:
  replicas: 4
  selector:
    matchLabels:
      app: snowfall
  template:
    metadata:
      labels:
        app: snowfall
    spec:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
      containers:
        - name: inference
          image: registry.internal.nimbus.ai/snow/inference:r12
          ports:
            - containerPort: 8080
          resources:
            limits:
              nvidia.com/gpu: 8
          env:
            - name: SNOW_MODEL
              value: snowfall-pro-70b
            - name: JWT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: snow-serving-secrets
                  key: jwt-signing-secret
          volumeMounts:
            - name: weights
              mountPath: /weights
      volumes:
        - name: weights
          persistentVolumeClaim:
            claimName: snowfall-weights-pvc
---
apiVersion: v1
kind: Secret
metadata:
  name: snow-serving-secrets
  namespace: snow-serving
type: Opaque
stringData:
