# Project SNOW — local dev stack
# CONFIDENTIAL — Nimbus AI Internal Use Only
version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: snowfall
      POSTGRES_USER: snow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-only}
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  inference:
    build: ./inference
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [postgres, redis]

  gateway:
    build: ./gateway
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [inference]
